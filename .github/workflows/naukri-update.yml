name: Naukri Update
on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python naukri_update.py
        env:
          NAUKRI_USER: ${{ secrets.NAUKRI_USER }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: error-screenshot, path: error.png }